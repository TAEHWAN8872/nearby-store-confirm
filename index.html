<style>
  :root{
    --ink:#1f2a24;
    --paper:#f7f5ef;
    --card:#ffffff;
    --line:#dcd6c8;
    --walnut:#6b4a35;
    --walnut-dark:#4a3325;
    --accent:#8a6d4a;
    --accent-soft:#efe6d6;
    --ok:#3f7a5a;
    --err:#b5493a;
    --muted:#7a7364;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;
  }
  .wrap{
    max-width:880px;
    margin:0 auto;
    padding:36px 20px 80px;
  }
  header.page-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:28px;
    border-bottom:2px solid var(--walnut);
    padding-bottom:16px;
  }
  header.page-head h1{
    font-size:21px;
    margin:0;
    letter-spacing:-0.01em;
    color:var(--walnut-dark);
  }
  header.page-head .sub{
    font-size:12.5px;
    color:var(--muted);
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:18px;
  }
  .card h2{
    font-size:14px;
    margin:0 0 14px;
    color:var(--walnut-dark);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h2 .num{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--walnut);
    color:#fff;
    font-size:11px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type=text], input[type=datetime-local], input[type=date], select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    font-size:13.5px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    border-color:var(--accent);
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .hint{
    font-size:11.5px;
    color:var(--muted);
    margin-top:5px;
  }
  table.stores{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  table.stores th{
    background:var(--accent-soft);
    color:var(--walnut-dark);
    font-weight:600;
    padding:7px 6px;
    border:1px solid var(--line);
    text-align:center;
  }
  table.stores td{
    border:1px solid var(--line);
    padding:5px;
    vertical-align:middle;
  }
  table.stores td.no{
    text-align:center;
    color:var(--muted);
    width:34px;
  }
  table.stores input{
    border:none;
    padding:6px 6px;
    font-size:12.5px;
    background:transparent;
  }
  table.stores input:focus{
    outline:1.5px solid var(--accent);
    border-radius:4px;
  }
  table.stores td.rm{
    width:30px;
    text-align:center;
  }
  table.stores td.rm button{
    border:none;
    background:none;
    color:var(--err);
    cursor:pointer;
    font-size:14px;
    line-height:1;
  }
  col.c-name{width:19%;}
  col.c-addr{width:52%;}
  col.c-phone{width:20%;}
  .table-actions{
    margin-top:10px;
    display:flex;
    gap:10px;
  }
  .ghost-btn{
    border:1px dashed var(--line);
    background:#fff;
    color:var(--accent);
    font-size:12px;
    padding:7px 12px;
    border-radius:7px;
    cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--accent);}
  .generate-bar{
    position:sticky;
    bottom:16px;
    margin-top:24px;
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 20px;
    box-shadow:0 8px 24px rgba(31,42,36,0.08);
  }
  .primary-btn{
    background:var(--walnut);
    color:#fff;
    border:none;
    padding:12px 22px;
    font-size:14px;
    font-weight:600;
    border-radius:8px;
    cursor:pointer;
    flex:none;
  }
  .primary-btn:hover{background:var(--walnut-dark);}
  .primary-btn:disabled{background:#b9ae9c;cursor:default;}
  .status{
    font-size:12.5px;
    color:var(--muted);
  }
  .status.err{color:var(--err);}
  .status.ok{color:var(--ok);}
  .region-select{
    max-width:260px;
  }
  .footnote{
    font-size:11.5px;
    color:var(--muted);
    margin-top:22px;
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-head">
    <h1>인근가맹점현황 제공확인서 자동생성</h1>
    <span class="sub">복호두 가맹계약서 부속서류</span>
  </header>

  <div class="card">
    <h2><span class="num">1</span>제공 일시 · 장소</h2>
    <div class="row2">
      <div class="field">
        <label for="provideDate">제공일시</label>
        <input type="datetime-local" id="provideDate" />
      </div>
      <div class="field">
        <label for="confirmDate">가맹희망자 수령 확인일자</label>
        <input type="date" id="confirmDate" />
        <div class="hint">비워두면 제공일시의 날짜를 그대로 사용합니다.</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">2</span>매장 정보</h2>
    <div class="field">
      <label for="storeAddress">매장 주소지</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="storeAddress" placeholder="예) 경기도 화성시 병점노을4로 29 L타워 108호" style="flex:1;" />
        <button type="button" class="ghost-btn" id="nearestBtn" style="white-space:nowrap;">가까운 순 자동 정렬</button>
      </div>
      <div class="hint" id="nearestStatus"></div>
    </div>
    <div class="field" style="margin-bottom:0">
      <label for="regionSelect">광역지방자치단체</label>
      <select id="regionSelect" class="region-select"></select>
      <div class="hint">선택한 지역의 네모칸(□)이 체크된 박스(☑)로 자동 표시됩니다.</div>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">3</span>인근가맹점 현황 (가까운 순 10개)</h2>
    <table class="stores">
      <colgroup>
        <col style="width:34px" />
        <col class="c-name" />
        <col class="c-addr" />
        <col class="c-phone" />
        <col style="width:30px" />
      </colgroup>
      <thead>
        <tr><th>No.</th><th>상호</th><th>소재지</th><th>전화번호</th><th></th></tr>
      </thead>
      <tbody id="storeRows"></tbody>
    </table>
    <div class="table-actions">
      <button type="button" class="ghost-btn" id="addRowBtn">+ 매장 추가</button>
    </div>
  </div>

  <div class="generate-bar">
    <button type="button" class="primary-btn" id="generateBtn">DOCX 생성 및 다운로드</button>
    <span class="status" id="statusMsg"></span>
  </div>

  <div class="footnote">입력한 정보는 저장되지 않으며, 파일은 브라우저 안에서만 생성됩니다.</div>
</div>

// ---- 매장 DB 기반 자동완성 ----
function normalizeStoreQuery(s){
  return (s || "").replace(/\s+/g, "").replace(/복호두/g, "");
}
const STORE_INDEX = STORE_DB.map(s => ({
  name: s.name,
  address: s.address,
  phone: s.phone,
  display: "복호두 " + s.name,
  norm: normalizeStoreQuery(s.name)
}));

function findStoreMatches(query){
  const nq = normalizeStoreQuery(query);
  if(!nq) return [];
  return STORE_INDEX.filter(s => s.norm.includes(nq)).slice(0, 8);
}

function findExactStore(query){
  const nq = normalizeStoreQuery(query);
  if(!nq) return null;
  const matches = STORE_INDEX.filter(s => s.norm === nq);
  return matches.length === 1 ? matches[0] : null;
}

function applyStoreToRow(tr, store){
  tr.querySelector(".f-name").value = store.display;
  tr.querySelector(".f-addr").value = store.address;
  tr.querySelector(".f-phone").value = store.phone;
}

function wireAutocomplete(tr){
  const nameInput = tr.querySelector(".f-name");
  const dropdown = tr.querySelector(".ac-dropdown");

  function closeDropdown(){
    dropdown.innerHTML = "";
    dropdown.style.display = "none";
  }

  function renderMatches(matches){
    if(matches.length === 0){ closeDropdown(); return; }
    dropdown.innerHTML = matches.map((s, i) =>
      `<div class="ac-item" data-idx="${i}">
         <span class="ac-name">${s.display}</span>
         <span class="ac-addr">${s.address}</span>
       </div>`
    ).join("");
    dropdown.style.display = "block";
    [...dropdown.querySelectorAll(".ac-item")].forEach((el, i) => {
      el.addEventListener("mousedown", (e) => {
        e.preventDefault();
        applyStoreToRow(tr, matches[i]);
        closeDropdown();
      });
    });
  }

  nameInput.addEventListener("input", () => {
    renderMatches(findStoreMatches(nameInput.value));
  });
  nameInput.addEventListener("focus", () => {
    if(nameInput.value.trim()) renderMatches(findStoreMatches(nameInput.value));
  });
  nameInput.addEventListener("blur", () => {
    setTimeout(() => {
      closeDropdown();
      const exact = findExactStore(nameInput.value);
      if(exact) applyStoreToRow(tr, exact);
    }, 120);
  });
}

// ---- 카카오 지오코딩 기반 "가까운 순 자동 정렬" ----
const GEO_CACHE_KEY = "bokhodu_store_geo_v1";
const nearestBtn = document.getElementById("nearestBtn");
const nearestStatus = document.getElementById("nearestStatus");
let geocoder = null;
let geocodingReady = false;

function initGeocoder(){
  if(typeof kakao === "undefined" || !kakao.maps || !kakao.maps.services){
    nearestStatus.textContent = "카카오맵 키가 설정되지 않았습니다 (스크립트 상단의 373f651aa208f760e79254dc82babe98를 발급받은 키로 교체해주세요).";
    return false;
  }
  geocoder = new kakao.maps.services.Geocoder();
  return true;
}

function geocodeOne(address){
  return new Promise((resolve) => {
    geocoder.addressSearch(address, (result, status) => {
      if(status === kakao.maps.services.Status.OK && result.length > 0){
        resolve({ lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
      } else {
        resolve(null); // 실패한 주소는 null로 남기고 넘어감
      }
    });
  });
}

function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function ensureStoreGeocoding(){
  if(geocodingReady) return true;
  if(!geocoder && !initGeocoder()) return false;

  // 캐시 확인 (매장 수가 같으면 캐시 재사용)
  try{
    const cached = JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || "null");
    if(cached && cached.count === STORE_DB.length){
      cached.data.forEach((c, i) => { STORE_DB[i].lat = c.lat; STORE_DB[i].lng = c.lng; });
      geocodingReady = true;
      return true;
    }
  }catch(e){ /* 캐시 손상 시 무시하고 새로 진행 */ }

  for(let i=0;i<STORE_DB.length;i++){
    nearestStatus.textContent = `매장 좌표 준비 중... (${i+1}/${STORE_DB.length})`;
    const geo = await geocodeOne(STORE_DB[i].address);
    if(geo){ STORE_DB[i].lat = geo.lat; STORE_DB[i].lng = geo.lng; }
    await new Promise(r => setTimeout(r, 40)); // 과도한 연속 호출 방지
  }

  try{
    localStorage.setItem(GEO_CACHE_KEY, JSON.stringify({
      count: STORE_DB.length,
      data: STORE_DB.map(s => ({ lat: s.lat, lng: s.lng }))
    }));
  }catch(e){ /* 저장 실패해도 동작에는 지장 없음 */ }

  geocodingReady = true;
  return true;
}

nearestBtn.addEventListener("click", async () => {
  const addr = document.getElementById("storeAddress").value.trim();
  if(!addr){
    nearestStatus.textContent = "매장 주소지를 먼저 입력해주세요.";
    return;
  }
  if(!geocoder && !initGeocoder()) return;

  nearestBtn.disabled = true;
  nearestStatus.textContent = "기준 주소 좌표 확인 중...";
  const base = await geocodeOne(addr);
  if(!base){
    nearestStatus.textContent = "입력하신 주소의 좌표를 찾지 못했습니다. 주소를 다시 확인해주세요.";
    nearestBtn.disabled = false;
    return;
  }

  const ready = await ensureStoreGeocoding();
  if(!ready){ nearestBtn.disabled = false; return; }

  const ranked = STORE_INDEX
    .map((s, i) => ({ ...s, lat: STORE_DB[i].lat, lng: STORE_DB[i].lng }))
    .filter(s => typeof s.lat === "number" && typeof s.lng === "number")
    .map(s => ({ ...s, dist: haversineKm(base.lat, base.lng, s.lat, s.lng) }))
    .sort((a, b) => a.dist - b.dist)
    .slice(0, 10);

  const rows = [...storeRowsEl.querySelectorAll("tr")];
  ranked.forEach((s, i) => {
    if(!rows[i]) return;
    applyStoreToRow(rows[i], s);
    rows[i].querySelector(".f-name").title = `직선거리 약 ${s.dist.toFixed(2)}km`;
  });

  nearestStatus.textContent = `가까운 매장 ${ranked.length}곳을 자동으로 채웠습니다 (직선거리 기준).`;
  nearestBtn.disabled = false;
});

// ---- default provide date = now ----
(function setDefaultDate(){
  const now = new Date();
  const pad = n => String(n).padStart(2,"0");
  const local = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  document.getElementById("provideDate").value = local;
})();

// ---- helpers ----
function buildRegionLine(list, selected){
  return list.map(r => (r === selected ? ("☑ " + r) : ("□ " + r))).join("   ");
}

function formatProvideDate(dtLocalValue){
  if(!dtLocalValue) return "";
  const d = new Date(dtLocalValue);
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}년 ${pad(d.getMonth()+1)}월 ${pad(d.getDate())}일 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatConfirmDate(dateValue, fallbackDtLocal){
  let d;
  if(dateValue){
    d = new Date(dateValue + "T00:00:00");
  } else if(fallbackDtLocal){
    d = new Date(fallbackDtLocal);
  } else {
    d = new Date();
  }
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}년  ${pad(d.getMonth()+1)}월  ${pad(d.getDate())}일`;
}

function base64ToUint8Array(base64){
  const binStr = atob(base64);
  const bytes = new Uint8Array(binStr.length);
  for(let i=0;i<binStr.length;i++) bytes[i] = binStr.charCodeAt(i);
  return bytes;
}

// ---- generate ----
const statusMsg = document.getElementById("statusMsg");
const generateBtn = document.getElementById("generateBtn");

generateBtn.addEventListener("click", () => {
  statusMsg.textContent = "";
  statusMsg.className = "status";

  const provideDateRaw = document.getElementById("provideDate").value;
  const storeAddress = document.getElementById("storeAddress").value.trim();
  const region = regionSelect.value;
  const confirmDateRaw = document.getElementById("confirmDate").value;

  if(!provideDateRaw){
    statusMsg.textContent = "제공일시를 입력해 주세요.";
    statusMsg.className = "status err";
    return;
  }
  if(!storeAddress){
    statusMsg.textContent = "매장 주소지를 입력해 주세요.";
    statusMsg.className = "status err";
    return;
  }

  const stores = [];
  [...storeRowsEl.querySelectorAll("tr")].forEach((tr, idx) => {
    const name = tr.querySelector(".f-name").value.trim();
    const address = tr.querySelector(".f-addr").value.trim();
    const phone = tr.querySelector(".f-phone").value.trim();
    if(name || address || phone){
      stores.push({ no: idx+1, name, address, phone });
    }
  });

  if(stores.length === 0){
    statusMsg.textContent = "인근가맹점 정보를 최소 1개 이상 입력해 주세요.";
    statusMsg.className = "status err";
    return;
  }

  try{
    const zip = new PizZip(base64ToUint8Array(TEMPLATE_B64));
    const doc = new docxtemplater(zip, { paragraphLoop: true, linebreaks: true });

    doc.render({
      date: formatProvideDate(provideDateRaw),
      storeAddress: storeAddress,
      regionLine1: buildRegionLine(REGION_ROW1, region),
      regionLine2: buildRegionLine(REGION_ROW2, region),
      confirmDate: formatConfirmDate(confirmDateRaw, provideDateRaw),
      stores: stores
    });

    const out = doc.getZip().generate({
      type: "blob",
      mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    });

    const d = new Date(provideDateRaw);
    const pad = n => String(n).padStart(2,"0");
    const fname = `인근가맹점현황제공확인서_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.docx`;

    const url = URL.createObjectURL(out);
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);

    statusMsg.textContent = `${fname} 다운로드 완료`;
    statusMsg.className = "status ok";
  }catch(err){
    console.error(err);
    let detail = err.message || String(err);
    if(err.properties && err.properties.errors && err.properties.errors.length){
      detail = err.properties.errors.map(e => e.message).join(", ");
    }
    statusMsg.textContent = "생성 중 오류: " + detail;
    statusMsg.className = "status err";
  }
});
</script>
